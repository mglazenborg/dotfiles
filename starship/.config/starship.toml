"$schema" = 'https://starship.rs/config-schema.json'

palette = "tokyonight"
format = """
$directory\
$git_branch\
$git_status\
$cmd_duration\
$kubernetes\
$azure\
$line_break\
$python\
$character"""

[directory]
style = "blue"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "muted"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218) ($ahead_behind$stashed)]($style)"
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "muted"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[kubernetes]
disabled = false
format = '[| ](muted)[ $context]($style)[(:$namespace)](muted) '
style = "muted"

[azure]
disabled = false
format = '[| ](muted)[ $subscription]($style) '
style = "muted"

[python]
format = "[$virtualenv]($style) "
style = "muted"
detect_extensions = []
detect_files = []

[palettes.tokyonight]
accent             = "#7aa2f7"
selection          = "#292e42"
muted              = "#414868"
background         = "#1a1b26"
dark_background    = "#13141c"
darker_background  = "#0e0e14"
lighter_background = "#24283b"
foreground         = "#a9b1d6"
dark_foreground    = "#565f89"
light_foreground   = "#b4bee6"
bright_foreground  = "#c0caf5"
red                = "#f7768e"
yellow             = "#e0af68"
orange             = "#eb927b"
green              = "#9ece6a"
cyan               = "#449dab"
blue               = "#7aa2f7"
magenta            = "#ad8ee6"
brown              = "#75493d"
bright_red         = "#ff7a93"
bright_yellow      = "#ff9e64"
bright_green       = "#b9f27c"
bright_cyan        = "#0db9d7"
bright_blue        = "#7da6ff"
bright_magenta     = "#bb9af7"
